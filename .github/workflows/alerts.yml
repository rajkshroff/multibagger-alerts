name: AlphaLens Alerts

on:
  push:
    branches: [main]
  schedule:
    # Daily Engine Audit -- 5:45 IST = 00:15 UTC Mon-Fri
    - cron: '15 0 * * 1-5'
    # News Slot 1 -- 09:00 IST = 03:30 UTC
    - cron: '30 3 * * 1-5'
    # News Slot 2 -- 12:30 IST = 07:00 UTC
    - cron: '0 7 * * 1-5'
    # News Slot 3 -- 16:30 IST = 11:00 UTC
    - cron: '0 11 * * 1-5'
    # Catalyst poller -- every 5 min, 4:30am-3:30pm IST (s141: extended from 8:30am)
    # 4:30am-5:30am IST = 23:00-00:00 UTC (prev day Sun-Thu)
    - cron: '*/5 23 * * 0-4'
    # 5:30am-3:30pm IST = 00:00-10:00 UTC Mon-Fri
    - cron: '*/5 0-10 * * 1-5'

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TRIGGERED_BY_PUSH: ${{ github.event_name == 'push' && 'true' || '' }}
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "$SCHED" = "15 0 * * 1-5" ]; then
            echo "AUDIT: Daily engine health audit"
            python cloud_alert_engine.py --audit
          elif [ "$SCHED" = "30 3 * * 1-5" ] || [ "$SCHED" = "0 7 * * 1-5" ] || [ "$SCHED" = "0 11 * * 1-5" ]; then
            echo "TYPE 3: News"
            python cloud_alert_engine.py --news
          elif [ "$SCHED" = "*/5 23 * * 0-4" ] || [ "$SCHED" = "*/5 0-10 * * 1-5" ]; then
            echo "MSG4/5: Catalyst poller"
            python cloud_alert_engine.py --catalyst-only
          else
            echo "TYPE 1: Action Plan (push trigger)"
            python cloud_alert_engine.py
          fi

      - name: Save dedup state (seen_hashes + morning_brief + hourly_news)
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase --autostash 2>/dev/null || true
          git add seen_hashes.json hourly_news_sent.json 2>/dev/null || git add seen_hashes.json
          git diff --staged --quiet || git commit -m "ci: update dedup state [skip ci]"
          git push 2>/dev/null || true
